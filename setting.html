<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Setting - HADIRIN</title><link rel="icon" href="/assets/images/favicon.ico">
<link rel="stylesheet" href="/assets/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/libs/bootstrap-icons/bootstrap-icons.css"><link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/hadirin.css"></head><body>
<div id="app-content">
<div class="page-header"><div><h1 class="page-title">Setting</h1><p class="page-subtitle">Lokasi kantor, jam kerja, dan keamanan akun.</p></div></div>
<div class="row g-4 mb-4"><div class="col-12 col-lg-6"><div class="card border-light shadow-sm p-4 h-100"><h5 class="card-title mb-4">Lokasi & Jam Kerja</h5>
<div class="alert-custom alert-custom-primary mb-4"><i class="bi bi-info-circle-fill alert-custom-icon"></i><div class="alert-custom-content">Karyawan hanya bisa absen saat berada dalam radius dari titik kantor.</div></div><form id="f1"><div class="mb-3"><label for="lat" class="form-label-custom">Latitude kantor</label><input type="number" id="lat" class="form-control-custom" step="any" required></div><div class="mb-3"><label for="lng" class="form-label-custom">Longitude kantor</label><input type="number" id="lng" class="form-control-custom" step="any" required></div><div class="mb-3"><label for="rad" class="form-label-custom">Radius absen (meter)</label><input type="number" id="rad" class="form-control-custom" min="10" required></div><div class="mb-3"><label for="ws" class="form-label-custom">Jam masuk acuan (untuk menghitung telat)</label><input type="time" id="ws" class="form-control-custom" ></div><div class="mb-3"><label for="tm" class="form-label-custom">Kerja bersih minimal untuk boleh pulang (menit)</label><input type="number" id="tm" class="form-control-custom" min="1" max="1440" required><div class="form-text">420 menit = 7 jam bersih. Jam pulang paling cepat = jam masuk + target + total istirahat.</div></div><div class="d-flex flex-wrap gap-2"><button class="btn-custom btn-custom-primary" type="submit">Simpan</button><button type="button" class="btn-custom btn-custom-outline-secondary" id="loc"><i class="bi bi-geo-alt"></i> Pakai lokasi saya</button></div></form></div></div>
<div class="col-12 col-lg-6"><div class="card border-light shadow-sm p-4 h-100"><h5 class="card-title mb-4">Ubah Password</h5><form id="f2"><div class="mb-3"><label for="np" class="form-label-custom">Password baru</label><input type="password" id="np" class="form-control-custom" minlength="6" required></div><div class="mb-3"><label for="np2" class="form-label-custom">Ulangi password baru</label><input type="password" id="np2" class="form-control-custom" required></div><button class="btn-custom btn-custom-primary" type="submit">Ubah Password</button></form></div></div></div></div>
<script src="/assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script src="/assets/js/core.js"></script>
<script>
initAdmin('setting').then(async m=>{if(!m)return;const {data:s}=await sb.from('settings').select('*').eq('id',1).single();
 $('#lat').value=s.office_lat;$('#lng').value=s.office_lng;$('#rad').value=s.radius_m;$('#ws').value=s.work_start?.slice(0,5);$('#tm').value=s.target_minutes||420;});
$('#loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('#lat').value=p.coords.latitude.toFixed(6);$('#lng').value=p.coords.longitude.toFixed(6);},()=>toast('Izin lokasi ditolak',false));
$('#f1').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('settings').update({office_lat:+$('#lat').value,office_lng:+$('#lng').value,radius_m:+$('#rad').value,work_start:$('#ws').value,target_minutes:+$('#tm').value}).eq('id',1);
 error?toast(error.message,false):toast('Setting tersimpan');};
$('#f2').onsubmit=async e=>{e.preventDefault();if($('#np').value!==$('#np2').value)return toast('Password tidak sama',false);
 const {error}=await sb.auth.updateUser({password:$('#np').value});error?toast(error.message,false):(toast('Password diubah'),e.target.reset());};
</script></body></html>
